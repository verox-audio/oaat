[package]
name = "oaat-endpoint"
description = "Endpoint SDK for OAAT (Open Advanced Audio Transport)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
oaat-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
mdns-sd = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
hostname = { workspace = true }
cpal = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }

symphonia = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
# Announce through the system's Avahi daemon over D-Bus (feature mdns-avahi).
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Direct ALSA output (alsa_direct): the version cpal already pulls in.
alsa = "0.9"

[features]
default = ["audio-output", "flac", "tls", "web-ui"]
audio-output = ["dep:cpal", "dep:ringbuf"]
flac = ["dep:symphonia"]
tls = ["dep:tokio-rustls", "dep:rustls", "oaat-core/tls"]
# Announce through Avahi (D-Bus) instead of the built-in mDNS responder, for
# systems where avahi-daemon already owns mDNS (Linux distributions).
mdns-avahi = ["dep:zbus", "dep:futures-util"]
web-ui = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
